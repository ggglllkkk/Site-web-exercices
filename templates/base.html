<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    {% block head %}{% endblock %}
</head>

<body>
    <div id="error">
        {{ error }}

        {% if error %}
        <form action="/" method="GET">
            <button>Accueil</button>
        </form>
        {% endif %}
    </div>

    {% block body %}
    {% endblock %}
</body>

</html>
